<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="pvcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
  </defs>
  <!-- Rounded Base Plate -->
  <rect width="64" height="64" rx="14" fill="url(#pvcGrad)"/>
  
  <!-- Outer Calibration Circle -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" stroke-dasharray="2 3"/>
  
  <!-- Pipe Outer Wall -->
  <circle cx="32" cy="32" r="19" fill="url(#innerGrad)" stroke="#ffffff" stroke-width="3"/>
  
  <!-- Pipe Inner Bore (Throughput Hole) -->
  <circle cx="32" cy="32" r="11" fill="#022c22" stroke="#34d399" stroke-width="2.5"/>
  
  <!-- Center Laser/Alignment Point -->
  <circle cx="32" cy="32" r="3.5" fill="#5eead4"/>
  
  <!-- Metric Extrusion Crosshairs -->
  <path d="M32 5v6M32 53v6M5 32h6M53 32h6" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
</svg>
